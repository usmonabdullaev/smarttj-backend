services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - '3001'

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - smarttj-network

  postgres:
    image: postgres:18

    container_name: smarttj-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - smarttj-network

  redis:
    image: redis:8-alpine

    container_name: smarttj-redis

    restart: unless-stopped

    volumes:
      - redis-data:/data

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

    command: redis-server --appendonly yes

    networks:
      - smarttj-network

  loki:
    image: grafana/loki:latest
    container_name: smarttj-loki
    restart: unless-stopped
    user: '10001:10001'
    command: -config.file=/etc/loki/loki-config.yaml

    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

    networks:
      - smarttj-network

    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3100/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  promtail:
    image: grafana/promtail:latest
    container_name: smarttj-promtail
    restart: unless-stopped

    command: -config.file=/etc/promtail/promtail-config.yaml

    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - ./logs:/var/log/smarttj:ro
      - promtail-positions:/tmp

    networks:
      - smarttj-network

    depends_on:
      loki:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  grafana:
    image: grafana/grafana:latest
    container_name: smarttj-grafana
    restart: unless-stopped

    ports:
      - '127.0.0.1:3010:3000'

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_ALLOW_ORG_CREATE: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_DISABLE_LOGIN_FORM: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    networks:
      - smarttj-network

    depends_on:
      loki:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data:
  redis-data:
  loki-data:
  promtail-positions:
  grafana-data:

networks:
  smarttj-network:
    external: true
