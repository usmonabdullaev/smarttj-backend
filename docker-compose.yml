services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./logs:/app/logs

    labels:
      logging: "promtail"
      service: "smarttj-backend"

    networks:
      - smarttj-network

networks:
  smarttj-network:
    external: true
