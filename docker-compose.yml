services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "3001"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
    
    networks:
      - smarttj-network
  
  postgres:
    image: postgres:18

    container_name: smarttj-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - smarttj-network

volumes:
  postgres_data:

networks:
  smarttj-network:
    external: true
