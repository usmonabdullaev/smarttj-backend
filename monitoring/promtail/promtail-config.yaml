server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nest-combined
    static_configs:
      - targets:
          - localhost
        labels:
          job: nest-app
          log_type: combined
          path: /var/log/smarttj/combined-*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            context: context
            ts: timestamp

      - timestamp:
          source: ts
          format: RFC3339Nano

      - labels:
          level:
          context:

  - job_name: nest-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nest-app
          log_type: error
          path: /var/log/smarttj/error-*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            context: context
            ts: timestamp

      - timestamp:
          source: ts
          format: RFC3339Nano

      - labels:
          level:
          context:
