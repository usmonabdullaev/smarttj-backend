auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Дефолтный ретеншн = самому долгому источнику (error-логи, 30д).
  retention_period: 720h # 30 дней
  # Per-stream override: combined-логи храним 14д, как maxFiles: '14d' в winston.
  retention_stream:
    - selector: '{log_type="combined"}'
      priority: 1
      period: 336h # 14 дней
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_series: 10000
  max_query_parallelism: 16
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  volume_enabled: true
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: ''
  enable_api: true

analytics:
  reporting_enabled: false
